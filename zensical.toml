[project]
site_name = "Crabyard"
site_description = "Build Rust and Tauri apps with reproducible scaffolds, native foundations, and useful coding-agent context."
site_url = "https://docs.crabyard.com/"
repo_url = "https://github.com/Crabyardcom/crabyard-docs"
repo_name = "Crabyardcom/crabyard-docs"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "dist"
use_directory_urls = true
strict = true
extra_css = ["stylesheets/crabyard.css"]
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Introduction" = "getting-started/introduction.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quick start" = "getting-started/quick-start.md" },
  ] },
  { "Guides" = [
    { "Authentication" = "guides/auth.md" },
    { "UI frameworks" = "guides/ui.md" },
    { "Settings" = "guides/settings.md" },
    { "Custom title bar" = "guides/title-bar.md" },
    { "Onboarding tour" = "guides/onboarding.md" },
    { "Splash screen" = "guides/splash-screen.md" },
    { "Auto-updates" = "guides/auto-updates.md" },
    { "AI handoff and readiness" = "guides/ai-development.md" },
    { "Overlay architecture" = "guides/overlay-architecture.md" },
    { "Troubleshooting" = "guides/troubleshooting.md" },
  ] },
  { "Reference" = [
    { "CLI commands" = "reference/cli.md" },
    { "Project structure" = "reference/structure.md" },
    { "Configuration" = "reference/config.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/crabyard.svg"
favicon = "assets/favicon.svg"
font = false
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.search]
